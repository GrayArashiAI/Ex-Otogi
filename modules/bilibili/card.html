<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #fff; color: #18191c; }
  body { font-family: "Inter", "Noto Sans", "Noto Sans CJK SC", "PingFang SC", "Noto Color Emoji", sans-serif; -webkit-font-smoothing: antialiased; }
  /* Laid out at the width chat apps show an image (about 480 px) and drawn
     at 3x, so sizes here are the sizes people read. */
  .card { width: 480px; background: #fff; }
  .cover { position: relative; aspect-ratio: 16 / 9; background: #e3e5e7; }
  .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .badge { position: absolute; padding: 2px 7px; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 600; line-height: 1.35; letter-spacing: .02em; }
  .duration { right: 10px; bottom: 10px; background: rgba(0, 0, 0, .66); font-variant-numeric: tabular-nums; }
  .parts { left: 10px; top: 10px; background: #cc2d65; }
  .body { padding: 14px 16px 16px; }
  h1 { font-size: 18px; font-weight: 700; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .owner { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .owner img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px #e3e5e7; }
  .who { min-width: 0; flex: 1; }
  .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when { color: #666b73; font-size: 12.5px; margin-top: 1px; }
  .honors { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; max-width: 46%; }
  .honor { padding: 2px 8px; border-radius: 999px; background: #fff1f5; color: #cc2d65; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(12, 1fr); gap: 7px; margin-top: 14px; }
  .stat:nth-child(-n+4) { grid-column: span 3; }
  .stat:nth-child(n+5) { grid-column: span 4; }
  .stat { display: flex; align-items: center; gap: 6px; padding: 8px 9px; border-radius: 10px; background: #f6f7f8; }
  .stat svg { flex: none; width: 18px; height: 18px; color: #61666d; }
  .stat.hot svg { color: #cc2d65; }
  .num { font-size: 15px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .label { color: #666b73; font-size: 12px; line-height: 1.25; }
  .desc { margin-top: 12px; padding: 9px 11px; border-radius: 10px; background: #f6f7f8; }
  .desc p { color: #61666d; font-size: 13px; line-height: 1.6; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .brand { color: #cc2d65; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
  .id { color: #666b73; font-size: 12px; font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; letter-spacing: .03em; }
</style>
</head>
<body>
<div class="card">
    <div class="cover">
      {{if .Cover}}<img src="{{.Cover}}" alt="">{{end}}
      {{if gt .Parts 1}}<span class="badge parts">{{.Parts}}P</span>{{end}}
      <span class="badge duration">{{.Duration}}</span>
    </div>
    <div class="body">
      <h1>{{.Title}}</h1>
      <div class="owner">
        {{if .Face}}<img src="{{.Face}}" alt="">{{end}}
        <div class="who">
          <div class="name">{{.Owner}}</div>
          <div class="when">{{.Published}}</div>
        </div>
        {{if .Honors}}<div class="honors">{{range .Honors}}<span class="honor">{{.}}</span>{{end}}</div>{{end}}
      </div>
      <div class="stats">
        {{range .Stats}}<div class="stat{{if .Hot}} hot{{end}}">{{.Icon}}<div><div class="num">{{.Value}}</div><div class="label">{{.Label}}</div></div></div>
        {{end}}
      </div>
      {{if .Desc}}<div class="desc"><p>{{.Desc}}</p></div>{{end}}
      <div class="foot">
        <span class="brand">bilibili</span>
        <span class="id">{{.ID}}</span>
      </div>
    </div>
</div>
</body>
</html>
