# Queries for the tables added since sqlc was adopted; `make generate`
# writes the Go code next to them.
version: "2"
sql:
  - engine: sqlite
    schema: internal/adapter/modulestore/migrations
    queries: internal/adapter/modulestore/queries
    gen:
      go:
        package: queries
        out: internal/adapter/modulestore/queries
  - engine: sqlite
    schema: internal/adapter/telegram/store/migrations
    queries: internal/adapter/telegram/store/queries
    gen:
      go:
        package: queries
        out: internal/adapter/telegram/store/queries
  - engine: sqlite
    schema: internal/adapter/management/migrations
    queries: internal/adapter/management/queries
    gen:
      go:
        package: queries
        out: internal/adapter/management/queries
